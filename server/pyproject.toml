[project]
name = "clipper-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yt-dlp==2026.8.19",
    "yt-dlp-ejs==0.8.0",
    "bgutil-ytdlp-pot-provider==2.0.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
rq = ["rq>=2", "redis>=5"]
storage = ["boto3>=1.35"]
whisper = ["faster-whisper>=1.1"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
